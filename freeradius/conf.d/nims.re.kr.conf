client 2017_nims_re_kr_67 {
	ipaddr = ${NIMS_RE_KR_IPADDR}
	secret = ${NIMS_RE_KR_SECRET}
	shortname = 2017_nims_re_kr_67
	operator_name = '1nims.re.kr'
}

home_server 2017_nims_re_kr_67 {
	type = auth+acct
	ipaddr = ${NIMS_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${NIMS_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_nims_re_kr {
	type = fail-over
	home_server = 2017_nims_re_kr_67
}

realm nims.re.kr {
	auth_pool = pool_nims_re_kr
	acct_pool = pool_nims_re_kr
	nostrip
}

realm "~^(.+\.)nims\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
