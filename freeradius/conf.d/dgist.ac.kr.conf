client 2018_dgist_ac_kr_149 {
	ipaddr = ${DGIST_AC_KR_IPADDR_149}
	secret = ${DGIST_AC_KR_SECRET}
	shortname = 2018_dgist_ac_kr_149
	operator_name = '1dgist.ac.kr'
}

client 2018_dgist_ac_kr_150 {
	ipaddr = ${DGIST_AC_KR_IPADDR_150}
	secret = ${DGIST_AC_KR_SECRET}
	shortname = 2018_dgist_ac_kr_150
	operator_name = '1dgist.ac.kr'
}

home_server 2018_dgist_ac_kr_149 {
	type = auth+acct
	ipaddr = ${DGIST_AC_KR_IPADDR_149}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${DGIST_AC_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server 2018_dgist_ac_kr_150 {
	type = auth+acct
	ipaddr = ${DGIST_AC_KR_IPADDR_150}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${DGIST_AC_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_dgist_ac_kr {
	type = fail-over
	home_server = 2018_dgist_ac_kr_150
	home_server = 2018_dgist_ac_kr_149
}

realm dgist.ac.kr {
	auth_pool = pool_dgist_ac_kr
	acct_pool = pool_dgist_ac_kr
	nostrip
}

realm "~^(.+\.)dgist\.ac\.kr$" {
	virtual_server = auth-reject
	nostrip
}
