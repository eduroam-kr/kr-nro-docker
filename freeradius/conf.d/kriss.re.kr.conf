client 2022_kriss_re_kr_21 {
	ipaddr = ${KRISS_RE_KR_IPADDR}
	secret = ${KRISS_RE_KR_SECRET}
	shortname = 2022_kriss_re_kr_21
	operator_name = '1kriss.re.kr'
}

home_server 2022_kriss_re_kr_21 {
	type = auth+acct
	ipaddr = ${KRISS_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KRISS_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_kriss_re_kr {
	type = fail-over
	home_server = 2022_kriss_re_kr_21
}

realm kriss.re.kr {
	auth_pool = pool_kriss_re_kr
	acct_pool = pool_kriss_re_kr
	nostrip
}

realm "~^(.+\.)kriss\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
