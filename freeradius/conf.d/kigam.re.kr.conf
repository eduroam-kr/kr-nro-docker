client 2021_kigam_re_kr_82 {
	ipaddr = ${KIGAM_RE_KR_IPADDR}
	secret = ${KIGAM_RE_KR_SECRET}
	shortname = 2021_kigam_re_kr_82
	operator_name = '1kigam.re.kr'
}

home_server 2021_kigam_re_kr_82 {
	type = auth+acct
	ipaddr = ${KIGAM_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KIGAM_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_kigam_re_kr {
	type = fail-over
	home_server = 2021_kigam_re_kr_82
}

realm kigam.re.kr {
	auth_pool = pool_kigam_re_kr
	acct_pool = pool_kigam_re_kr
	nostrip
}

realm "~^(.+\.)kigam\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
