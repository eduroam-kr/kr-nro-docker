client 2026_kisti_idp_52 {
	ipaddr = ${KISTI_RE_KR_IPADDR}
	secret = ${KISTI_RE_KR_SECRET}
	shortname = 2026_kisti_idp_52
	operator_name = '1kisti.re.kr'
}

home_server 2026_kisti_idp_52 {
	type = auth+acct
	ipaddr = ${KISTI_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KISTI_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_kisti_idp_52 {
	type = fail-over
	home_server = 2026_kisti_idp_52
}

realm kisti.re.kr {
	auth_pool = pool_kisti_idp_52
	acct_pool = pool_kisti_idp_52
	nostrip
}

realm "~^(.+\.)kisti\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
