client 2023_kaist_ac_kr_14 {
	ipaddr = ${KAIST_AC_KR_IPADDR_14}
	secret = ${KAIST_AC_KR_SECRET}
	shortname = 2023_kaist_ac_kr_14
	operator_name = '1kaist.ac.kr'
}

client 2023_kaist_ac_kr_15 {
	ipaddr = ${KAIST_AC_KR_IPADDR_15}
	secret = ${KAIST_AC_KR_SECRET}
	shortname = 2023_kaist_ac_kr_15
	operator_name = '1kaist.ac.kr'
}

client 2018_seoul_kaist_ac_kr_2 {
	ipaddr = ${SEOUL_KAIST_AC_KR_IPADDR_2}
	secret = ${SEOUL_KAIST_AC_KR_SECRET}
	shortname = 2018_seoul_kaist_ac_kr_2
	operator_name = '1seoul.kaist.ac.kr'
}

client 2018_seoul_kaist_ac_kr_3 {
	ipaddr = ${SEOUL_KAIST_AC_KR_IPADDR_3}
	secret = ${SEOUL_KAIST_AC_KR_SECRET}
	shortname = 2018_seoul_kaist_ac_kr_3
	operator_name = '1seoul.kaist.ac.kr'
}

home_server 2023_kaist_ac_kr_14 {
	type = auth+acct
	ipaddr = ${KAIST_AC_KR_IPADDR_14}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KAIST_AC_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server 2018_seoul_kaist_ac_kr_2 {
	type = auth+acct
	ipaddr = ${SEOUL_KAIST_AC_KR_IPADDR_2}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${SEOUL_KAIST_AC_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server 2018_seoul_kaist_ac_kr_3 {
	type = auth+acct
	ipaddr = ${SEOUL_KAIST_AC_KR_IPADDR_3}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${SEOUL_KAIST_AC_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_kaist_ac_kr {
	type = fail-over
	home_server = 2023_kaist_ac_kr_14
}

home_server_pool pool_seoul_kaist_ac_kr {
	type = fail-over
	home_server = 2018_seoul_kaist_ac_kr_2
	home_server = 2018_seoul_kaist_ac_kr_3
}

realm kaist.ac.kr {
	auth_pool = pool_kaist_ac_kr
	acct_pool = pool_kaist_ac_kr
	nostrip
}

realm seoul.kaist.ac.kr {
	auth_pool = pool_seoul_kaist_ac_kr
	acct_pool = pool_seoul_kaist_ac_kr
	nostrip
}

realm "~^(.+\.)kaist\.ac\.kr$" {
	virtual_server = auth-reject
	nostrip
}
