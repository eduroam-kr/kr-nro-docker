client 2026_kopri_re_kr_55 {
	ipaddr = ${KOPRI_RE_KR_IPADDR}
	secret = ${KOPRI_RE_KR_SECRET}
	shortname = 2026_kopri_re_kr_55
	operator_name = '1kopri.re.kr'
}

home_server 2026_kopri_re_kr_55 {
	type = auth+acct
	ipaddr = ${KOPRI_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KOPRI_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_kopri_re_kr {
	type = fail-over
	home_server = 2026_kopri_re_kr_55
}

realm kopri.re.kr {
	auth_pool = pool_kopri_re_kr
	acct_pool = pool_kopri_re_kr
	nostrip
}

realm "~^(.+\.)kopri\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
