client 2023_ibs_re_kr_136 {
	ipaddr = ${IBS_RE_KR_IPADDR}
	secret = ${IBS_RE_KR_SECRET}
	shortname = 2023_ibs_re_kr_136
	operator_name = '1ibs.re.kr'
}

home_server 2023_ibs_re_kr_136 {
	type = auth+acct
	ipaddr = ${IBS_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${IBS_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_ibs_re_kr {
	type = fail-over
	home_server = 2023_ibs_re_kr_136
}

realm ibs.re.kr {
	auth_pool = pool_ibs_re_kr
	acct_pool = pool_ibs_re_kr
	nostrip
}

realm "~^(.+\.)ibs\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
