client 2022_kias_re_kr_7 {
	ipaddr = ${KIAS_RE_KR_IPADDR}
	secret = ${KIAS_RE_KR_SECRET}
	shortname = 2022_kias_re_kr_7
	operator_name = '1kias.re.kr'
}

home_server 2022_kias_re_kr_7 {
	type = auth+acct
	ipaddr = ${KIAS_RE_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KIAS_RE_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_kias_re_kr {
	type = fail-over
	home_server = 2022_kias_re_kr_7
}

realm kias.re.kr {
	auth_pool = pool_kias_re_kr
	acct_pool = pool_kias_re_kr
	nostrip
}

realm "~^(.+\.)kias\.re\.kr$" {
	virtual_server = auth-reject
	nostrip
}
