client 2026_postech_ac_kr_33 {
	ipaddr = ${POSTECH_AC_KR_IPADDR}
	secret = ${POSTECH_AC_KR_SECRET_1}
	shortname = 2026_postech_ac_kr_33
	operator_name = '1postech.ac.kr'
}

home_server 2026_postech_ac_kr_33 {
	type = auth+acct
	ipaddr = ${POSTECH_AC_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${POSTECH_AC_KR_SECRET_2}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_postech_ac_kr {
	type = fail-over
	home_server = 2026_postech_ac_kr_33
}

realm postech.ac.kr {
	auth_pool = pool_postech_ac_kr
	acct_pool = pool_postech_ac_kr
	nostrip
}

realm "~^(.+\.)postech\.ac\.kr$" {
	virtual_server = auth-reject
	nostrip
}
