client 2015_gist_ac_kr_197 {
	ipaddr = ${GIST_AC_KR_IPADDR}
	secret = ${GIST_AC_KR_SECRET}
	shortname = 2015_gist_ac_kr_197
	operator_name = '1gist.ac.kr'
}

home_server 2015_gist_ac_kr_197 {
	type = auth+acct
	ipaddr = ${GIST_AC_KR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${GIST_AC_KR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_gist_ac_kr {
	type = fail-over
	home_server = 2015_gist_ac_kr_197
}

realm gist.ac.kr {
	auth_pool = pool_gist_ac_kr
	acct_pool = pool_gist_ac_kr
	nostrip
}

realm "~^(.+\.)gist\.ac\.kr$" {
	virtual_server = auth-reject
	nostrip
}
