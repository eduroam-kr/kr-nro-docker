# The RO that relays most domestic .ac.kr. Order after conf.d/ is decisive.
# 국내 .ac.kr 대부분을 중계하는 RO. conf.d/ 다음이라는 순서가 결정적이다.
# docs/radius-routing.md · docs-priv/ro-fingerprints.md

client 2025_kren_kr_173 {
	ipaddr = ${KREN_RO_IPADDR_173}
	secret = ${KREN_RO_SECRET}
	shortname = 2025_kren_kr_173
}

client 2025_kren_kr_48 {
	ipaddr = ${KREN_RO_IPADDR_48}
	secret = ${KREN_RO_SECRET}
	shortname = 2025_kren_kr_48
}

home_server 2025_kren_kr_173 {
	type = auth+acct
	ipaddr = ${KREN_RO_IPADDR_173}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KREN_RO_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server 2025_kren_kr_48 {
	type = auth+acct
	ipaddr = ${KREN_RO_IPADDR_48}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${KREN_RO_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

# All realms below use the same server pair, so they share one pool.
# 아래 realm 이 모두 같은 서버 쌍을 쓰므로 pool 하나로 공유한다.
home_server_pool pool_kren_ro {
	type = fail-over
	home_server = 2025_kren_kr_173
	home_server = 2025_kren_kr_48
}

# ── The RO's own realms. Must sit above the unregistered .kr rule
# ── RO 조직 자체 realm. 아래 "미등록 .kr" 보다 위여야 한다 ──────
# 2026-09-30 해제. 경위는 docs-priv/ro-fingerprints.md
realm kren.kr {
	auth_pool = pool_kren_ro
	acct_pool = pool_kren_ro
	nostrip
}

realm teincc.kr {
	auth_pool = pool_kren_ro
	acct_pool = pool_kren_ro
	nostrip
}

# ── .ac.kr catch-all. After conf.d/, before the .kr rule below ─
# ── .ac.kr catch-all. 반드시 conf.d/ 뒤, 아래 .kr 규칙보다 위 ───
realm "~^(.*\.)*ac\.kr$" {
	auth_pool = pool_kren_ro
	acct_pool = pool_kren_ro
	nostrip
}

# ── Unregistered .kr ends here. Must sit below the catch-all ───
# .kr is a national namespace; the ETLR has nowhere to send it.
# .kr 은 한국 네임스페이스라 ETLR 로 내보내도 처리할 곳이 없다.
realm "~^(.*\.)*kr$" {
	virtual_server = auth-reject
	nostrip
}
