# Table of contents. The include order is the routing policy.
# 목차 파일. 읽는 순서가 곧 라우팅 정책이다.
# docs/radius-routing.md

proxy server {
	default_fallback = no
}

# Blackhole. Evaluated before every other realm, so it goes first.
# 블랙홀 — 라우팅 불가 realm 즉시 거절. 다른 realm 보다 먼저 평가되도록 위에 둔다.
$INCLUDE blackhole.conf

# Per-institution settings (client + home_server + pool + realm)
# 기관별 설정 (client + home_server + pool + realm). docs/onboarding.md
$INCLUDE conf.d/

# The RO. Its catch-all must follow the individual institutions.
# RO (.ac.kr 담당). catch-all 이 개별 기관보다 뒤여야 해서 conf.d/ 다음.
$INCLUDE kren_ro.conf

# ── International path ─────────────────────────────────────────
# ── 국제 경로 ─────────────────────────────────────────────────────
# etlr1.eduroam.org, DEFAULT
home_server 2015_etlr1_eduroam_org {
	type = auth+acct
	ipaddr = ${ETLR_IPADDR}
	port = 1812
	src_ipaddr = ${NRO_IPADDR}
	secret = ${ETLR_SECRET}
	response_window = 20
	zombie_period = 40
	revive_interval = 120
}

home_server_pool pool_etlr1_eduroam_org {
	type = fail-over
	home_server = 2015_etlr1_eduroam_org
}

realm etlr1.eduroam.org {
	auth_pool = pool_etlr1_eduroam_org
	acct_pool = pool_etlr1_eduroam_org
	nostrip
}

# ── DEFAULT: unknown realms go to the ETLR. UDP direct for now ─
# ── DEFAULT: 모르는 realm 은 국제 ETLR 로. 현재 UDP 직결 ─────────
# RadSec 전환 절차는 docs/radsec-migration.md
#
#home_server tlr {
#	type = auth+acct
#	ipaddr = 127.0.0.1
#	port = 11812
#	secret = ${LOCALHOST_SECRET}
#}
home_server_pool pool_default {
	type = fail-over
	home_server = 2015_etlr1_eduroam_org
#	home_server = tlr
}
realm DEFAULT {
	auth_pool = pool_default
	acct_pool = pool_default
	nostrip
}
