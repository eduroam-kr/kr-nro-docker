# Shared clients. Per-institution clients live in conf.d/.
# 공통 client. 기관별 client 는 conf.d/ 에 있다.
# docs/onboarding.md

client localhost {
	ipaddr = 127.0.0.1
	secret = ${LOCALHOST_SECRET}
	shortname = localhost
}

client 2015_etlr1_eduroam_org {
	ipaddr = ${ETLR_IPADDR}
	secret = ${ETLR_SECRET}
	shortname = 2015_etlr1_eduroam_org
# Global eduroam ETLR, operated by surfnet.nl
# 에듀롬 글로벌 surfnet.nl
}

