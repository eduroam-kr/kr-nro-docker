# Realms that cannot be routed. Rejected here, never sent to the ETLR.
# 라우팅 불가 realm. 여기서 끊고 ETLR 로 올려보내지 않는다.
# docs/blackhole.md

realm "~^(.*\.)*local$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*internal$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*lan$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*home$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*localdomain$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*localhost$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*invalid$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*guest$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*corp$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*intranet$" {
	virtual_server = auth-reject
	nostrip
}

# ── Mobile SIM realms that leaked in over WiFi ─────────────────
# ── 이동통신 SIM realm — WiFi 로 새어 들어온 것 ─────────────────
realm "~^(.*\.)*3gppnetwork\.org$" {
	virtual_server = auth-reject
	nostrip
}

# ── Not domain-shaped. Register only confirmed ones, one by one ─
# ── 도메인 형태가 아닌 realm. 확인된 것만 개별 등록한다 ─────────
realm univieguest {
	virtual_server = auth-reject
	nostrip
}
realm kaist {
	virtual_server = auth-reject
	nostrip
}

# ── The RO's own realms — unused ───────────────────────────────
# ⚠️ Not the .ac.kr catch-all. That one lives in kren_ro.conf.
# ⚠️ .ac.kr catch-all 과 혼동 금지. 그것은 kren_ro.conf 에 살아 있다.
# 2026-09-30 에 두 건을 해제했다. 경위는 docs-priv/ro-fingerprints.md
realm "~^(.*\.)*keris\.or\.kr$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*tein\.org$" {
	virtual_server = auth-reject
	nostrip
}

# ── Domestic institutions using a .edu realm ───────────────────
# A gTLD gives the ETLR no country to route by (RFC 7593).
# ⚠️ Never block foreign .edu. Always name institutions individually.
# gTLD 는 ETLR 가 국가를 판별하지 못해 해외에서 인증되지 않는다(RFC 7593).
# ⚠️ 해외 .edu 는 절대 막지 않는다. 반드시 기관 단위로 개별 지정한다.
# 근거와 실측은 docs/blackhole.md
realm "~^(.*\.)*postech\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*skku\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*inha\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*hanyang\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*kaist\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*korea\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*snu\.edu$" {
	virtual_server = auth-reject
	nostrip
}
realm "~^(.*\.)*cau\.edu$" {
	virtual_server = auth-reject
	nostrip
}

# ── Retired test realm. Deleting it would hit the catch-all ────
# ── 종료된 테스트 realm. 지우면 catch-all 을 타므로 명시 차단한다 ──
realm test.kaist.ac.kr {
	virtual_server = auth-reject
	nostrip
}

# ── Names no institution. Nothing can answer it ────────────────
# ── 기관을 특정하지 않는 realm. 어디서도 처리될 수 없다 ────────
realm ac.kr {
	virtual_server = auth-reject
	nostrip
}
