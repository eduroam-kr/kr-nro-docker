# Carries only the international RadSec leg (RADIUS/TLS, TCP 2083).
# 국제 구간의 RadSec(RADIUS/TLS, TCP 2083) 전송만 담당한다.
# docs/radsec-migration.md
#
# Realm routing policy stays in FreeRADIUS.
# realm 라우팅 정책은 FreeRADIUS 가 가진다.
#
#   out : freeradius --UDP:11812--> radsecproxy --TLS--> ETLR
#   in  : ETLR --TLS:2083--> radsecproxy --UDP:1812--> freeradius
#
# Certificates live in the private submodule: pki/certs/
# 인증서는 비공개 서브모듈에 있다: pki/certs/
#
# radsecproxy has no variable expansion of its own, so the image runs envsubst
# over this file at start-up. ${...} comes from .env via docker compose.
# radsecproxy 자체에는 변수 치환이 없어, 이미지가 기동할 때 envsubst 로 푼다.
# ${...} 는 .env 에서 docker compose 를 거쳐 들어온다.

ListenTCP        *:2083
ListenUDP        127.0.0.1:11812
LogLevel         3
LogDestination   file:///var/log/radsecproxy/radsecproxy.log

tls eduroam {
    CACertificateFile  /etc/radsecproxy/pki/certs/eduroam-ca.pem
    CertificateFile    /etc/radsecproxy/pki/certs/server-cert.pem
    CertificateKeyFile /etc/radsecproxy/pki/certs/server-key.pem
}

# Local FreeRADIUS, the internal UDP leg
# 로컬 FreeRADIUS (내부 UDP 구간)
client freeradius-udp {
    host 127.0.0.1
    type udp
    secret ${LOCALHOST_SECRET}
}
server freeradius-udp {
    host 127.0.0.1
    type udp
    port 1812
    secret ${LOCALHOST_SECRET}
    statusserver on
}

# International ETLR. Confirm the real endpoints and required CA with the
# federation operator before go-live.
# 국제 ETLR. 전환 전 실제 엔드포인트와 요구 CA 를 연합 운영자에게 확인할 것.
server etlr1 {
    host ${ETLR_HOST_1}
    type tls
    tls eduroam
    statusserver on
}
server etlr2 {
    host ${ETLR_HOST_2}
    type tls
    tls eduroam
    statusserver on
}

# Peers that reach us over RadSec. Narrow this to the real set in production.
# 국제에서 RadSec 으로 들어오는 피어. 운영 시 실제 피어 집합으로 좁힌다.
client etlr-in {
    host ${ETLR_HOST_1}
    host ${ETLR_HOST_2}
    type tls
    tls eduroam
}

# Our own realms go down to FreeRADIUS; everything else goes up.
# 우리가 담당하는 realm 은 FreeRADIUS 로, 나머지는 ETLR 로.
include /etc/radsecproxy/nro-direct-realms.conf
