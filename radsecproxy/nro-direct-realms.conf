# Realms this NRO answers directly.
# 이 NRO 가 직접 담당하는 realm 목록.
#
# Requests arriving over international RadSec for these realms go down to
# FreeRADIUS, which holds the home-server table. Everything else goes up.
# 국제 RadSec 으로 들어온 요청 중 아래 realm 은 FreeRADIUS 로 내려보낸다.
# 홈서버 표는 FreeRADIUS 가 가진다. 나머지는 위로 올려보낸다.
#
# Keep in step with freeradius/conf.d/. A realm declared there and missing
# here bounces back to the ETLR instead of reaching its home server.
# freeradius/conf.d/ 와 같이 유지한다. 거기 선언된 realm 이 여기 없으면
# 홈서버에 닿지 못하고 ETLR 로 되돌아간다. → docs/onboarding.md
#
# Realms relayed by an RO are not listed here. They never come this way.
# RO 가 중계하는 realm 은 여기 두지 않는다. 이 경로로 오지 않는다.

realm /@(dgist\.ac\.kr|gist\.ac\.kr|ibs\.re\.kr|kaist\.ac\.kr|seoul\.kaist\.ac\.kr|kias\.re\.kr|kigam\.re\.kr|kisti\.re\.kr|kopri\.re\.kr|kriss\.re\.kr|nims\.re\.kr|postech\.ac\.kr)$/i {
    server freeradius-udp
}

# Everything else — foreign realms seen at domestic campuses — goes up.
# 나머지(국내 캠퍼스에서 나가는 해외 realm)는 위로 올려보낸다.
realm * {
    server etlr1
    server etlr2
}
